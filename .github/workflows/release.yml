name: Publish signed release
run-name: Publish ${{ inputs.kind }} release
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Release interface files or a new native Android APK
        type: choice
        options: [interface, native]
        default: interface
        required: true
      native_version:
        description: Native version name (only for native, e.g. 1.1.0)
        required: false
        type: string
      native_code:
        description: Increasing integer Android versionCode (only for native)
        required: false
        type: string
      minimum_native:
        description: Minimum recommended native versionCode (cannot exceed latest APK)
        required: true
        default: '1'
        type: string
      ui_min_native:
        description: Minimum native bridge versionCode needed by this interface
        required: true
        default: '1'
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: signed-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install release verification dependency
        run: python -m pip install 'cryptography>=44,<47' 'requests>=2.32,<3'
      - name: Prepare Android SDK and signing key
        if: inputs.kind == 'native'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
          umask 077
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/seva-release.jks"
      - name: Build and sign release
        env:
          RELEASE_KIND: ${{ inputs.kind }}
          NATIVE_VERSION: ${{ inputs.native_version }}
          NATIVE_CODE: ${{ inputs.native_code }}
          MINIMUM_NATIVE: ${{ inputs.minimum_native }}
          UI_MIN_NATIVE: ${{ inputs.ui_min_native }}
          GH_TOKEN: ${{ github.token }}
          APK_KEYSTORE: ${{ runner.temp }}/seva-release.jks
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: python scripts/publish_release.py
      - name: Verify signed manifest and every published file
        run: python tests/test_release.py
      - name: Publish stable feed atomically in one commit
        run: |
          git config user.name 'Seva Saathi releases'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/updates docs/app version.json
          git commit -m 'release: publish verified stable manifest and assets'
          git push origin HEAD:main
      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/seva-release.jks"
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The raw signed feed is live immediately after the commit. Pages can cache it briefly.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo 'Pages will refresh on its next build; the raw signed feed is already live.'
